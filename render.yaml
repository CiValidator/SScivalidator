services:
  - type: web
    name: signsetu-gateway
    runtime: docker
    plan: free
    rootDir: gateway
    # Deploys only when asked, through the Render API; a push alone never deploys.
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENROLL_HASHES
        sync: false
      - key: ASSIST_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: ASSIST_MODEL
        value: openai/gpt-oss-20b
      - key: ASSIST_REASONING_EFFORT
        value: low
      # Owner decision: device tokens never expire; a lost phone is revoked by the administrator instead.
      - key: TOKEN_TTL_DAYS
        value: "0"
      - key: ASSIST_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
