services:
  - type: web
    name: signsetu-gateway
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENROLL_HASHES
        sync: false
      - key: ASSIST_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: ASSIST_MODEL
        value: openai/gpt-oss-20b
      - key: ASSIST_REASONING_EFFORT
        value: low
      - key: REQUIRE_PERSISTENT_DB
        value: "1"
      # A device token stops working this many days after enrolment; the phone then enrols again with a new code.
      - key: TOKEN_TTL_DAYS
        value: "90"
      - key: ASSIST_KEY
        sync: false
