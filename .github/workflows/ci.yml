name: ci
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.v.outputs.name }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$name" > /dev/null; then new=false; else new=true; fi
          echo "new=$new" >> "$GITHUB_OUTPUT"

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: disabled
      - name: Test and lint
        run: >-
          ./gradlew --console=plain :app:testStandardDebugUnitTest :app:testNearbyDebugUnitTest
          :app:compileStandardDebugAndroidTestKotlin :app:lintStandardRelease

  avatar:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: avatar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: avatar/package-lock.json
      - run: npm ci
      - run: npx vp check
      - run: npx vp test
      - name: The bundle in the app matches the source
        run: npx vp build && git diff --exit-code -- ../app/src/main/assets/avatar/avatar.js

  portal:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            portal/package-lock.json
            avatar/package-lock.json
      # The review screen renders with the avatar module's sources and dependencies.
      - run: npm ci --prefix ../avatar
      - run: npm ci
      - run: npx vp check
      - run: npx vp test
      - run: npx vp build

  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy resvg-py pillow soundfile
      - name: Python tool tests
        run: |
          for d in tools/isl tools/security tools/content tools/text2isl; do python -m unittest discover -s "$d" -p 'test_*.py' -v; done
      - name: Content manifest is current
        run: python tools/content/build_content.py --check
      - name: Content references, ids and language coverage
        run: python tools/content/check_content.py

  gateway:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gateway
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Formatted
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Fuzz
        run: |
          for f in FuzzPromptAllowed FuzzClientKey FuzzEnrollBody; do go test -run '^$' -fuzz "^$f\$" -fuzztime 30s .; done
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  semgrep:
    runs-on: ubuntu-24.04
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --severity ERROR --error

  osv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Scan app dependencies
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_amd64
          chmod +x osv-scanner
          # Lint and test tooling never ships, so scan only the release runtime lines.
          mkdir shipped
          grep -E '(standard|nearby)ReleaseRuntimeClasspath' app/gradle.lockfile > shipped/gradle.lockfile
          ./osv-scanner scan source --lockfile shipped/gradle.lockfile --format json --output osv.json || true
          # max_severity is a CVSS base score; 7.0 and above is high or critical.
          worst=$(jq '[.results[]?.packages[]?.groups[]?.max_severity | select(. != null and . != "") | tonumber] | max // 0' osv.json)
          echo "worst CVSS: $worst"
          jq -e ". < 7" <<< "$worst" > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osv
          path: osv.json

  # The emulator run is slow, so it gates a new version only; a manual run forces it.
  instrumented:
    needs: version
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: disabled
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A crashed test process leaves no stack in the report, so the device log rides along with it.
      # StageEndToEndTest needs a camera feed and the two MediaPipe tests need real clips and a GPU; the emulator here has neither.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: ./gradlew --console=plain :app:connectedStandardDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.signsetu.StageAccessibilityTest,app.signsetu.StageDeviceAccessibilityTest,app.signsetu.OverlayTouchTest,app.signsetu.SessionMigrationTest,app.signsetu.ReportExportDeviceTest || (adb logcat -d > app/build/reports/androidTests/logcat.txt; exit 1)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: instrumented-report
          path: app/build/reports/androidTests

  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A green master push publishes v<versionName>: a new version gets a new release, the same version is replaced.
  release:
    needs: [version, android, avatar, portal, tools, gateway, semgrep, osv, instrumented, gitleaks]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    concurrency: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.name }}
      GATEWAY_URL: https://signsetu-gateway.onrender.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: disabled
      - name: Build and sign
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KSPW: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$ks"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir out
          for abi in universal arm64; do
            args=""; [ "$abi" = arm64 ] && args="-Pabi=arm64-v8a"
            rm -rf app/build/outputs/apk
            ./gradlew --console=plain :app:assembleStandardRelease $args "-PgatewayUrl=$GATEWAY_URL"
            "$bt/zipalign" -f -p 4 app/build/outputs/apk/standard/release/*.apk "$RUNNER_TEMP/aligned.apk"
            "$bt/apksigner" sign --ks "$ks" --ks-key-alias signsetu --ks-pass env:KSPW --v4-signing-enabled false --out "out/sign-setu-$VERSION-$abi.apk" "$RUNNER_TEMP/aligned.apk"
          done
          rm "$ks"
          (cd out && sha256sum *.apk > SHA256SUMS)
      - id: syft
        uses: anchore/sbom-action/download-syft@v0
      - name: SBOM
        run: python3 tools/security/sbom.py "${{ steps.syft.outputs.cmd }}" && cp app/build/sbom/sign-setu-release.cdx.json out/
      - name: Publish
        run: |
          tag="v$VERSION"
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$tag" | head -1)
          { echo "Version $VERSION."; echo; echo "Changes since $prev:"; git log --format='- %s' "$prev..HEAD"
            echo; echo "SHA-256:"; cat out/SHA256SUMS; } > notes.md
          git tag -f "$tag" && git push -f origin "refs/tags/$tag"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes-file notes.md --latest
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" --title "Sign Setu $VERSION" --latest --notes-file notes.md out/*
          fi
